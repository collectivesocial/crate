name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Install api dependencies
        run: npm ci --prefix api

      - name: Lint api
        run: npm run lint --if-present --prefix api

      - name: Build api (type-check)
        run: npm run build --if-present --prefix api

      - name: Test api
        run: npm run test --if-present --prefix api
        env:
          NODE_ENV: test
          COOKIE_SECRET: test-secret-for-ci-at-least-32-characters-long
          DATABASE_URL: postgresql://localhost/test_not_used

      - name: Install importers dependencies
        run: npm ci --prefix importers

      - name: Lint importers
        run: npm run lint --if-present --prefix importers

      - name: Typecheck importers
        run: npm run typecheck --if-present --prefix importers

      - name: Test importers
        run: npm run test --if-present --prefix importers
        env:
          NODE_ENV: test

      - name: Install lexicons dependencies
        run: npm ci --prefix lexicons
